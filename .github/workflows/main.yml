name: Build Android AAB and APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ac (Varsa)
        run: |
          unzip -o "*.zip" || true
          ls -la

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Web Uygulamasini Derle ve Eslestir
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Android Yapilandirmasi ve Lisanslar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # Android SDK surumunu 35 olarak sabitle (Runner uyumlulugu)
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' android/variables.gradle || true

          # Release paketi icin imzalama tanimla
          if ! grep -q "signingConfig signingConfigs.debug" android/app/build.gradle; then
            sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' android/app/build.gradle || true
          fi

          # AdMob Manifest ID kontrolu
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<application/a \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' "$MANIFEST" || true
          fi

      - name: 1. APK Derle (Telefon Icin)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x lint -x test --no-daemon --stacktrace

      - name: APK Dosyasini Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: yuk-ve-sefer-hesaplayici-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: 2. AAB Derle (Google Play Icin)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease -x lint -x lintVitalRelease -x lintVitalAnalyzeRelease -x test --no-daemon --stacktrace

      - name: Google Play AAB Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
