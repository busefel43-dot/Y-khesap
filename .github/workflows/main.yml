name: Build Android AAB and APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ac
        run: |
          unzip -o "*.zip" || true
          ls -la

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle ve Derle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Android Ayarlari ve AdMob Ekle
        run: |
          # 1. Android SDK lisanslarini onayla
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # 2. compileSdk ve targetSdk'yi onyuklu olan 35'e ayarla
          sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/' android/variables.gradle || true

          # 3. Release derlemesini debug anahtariyla imzala
          sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' android/app/build.gradle || true

          # 4. AdMob Application ID (Gecerli Google Test App ID)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/a \ \ \ \ \ \ \ \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />' "$MANIFEST" || true
          fi

      - name: AAB ve APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug -x lint -x test --stacktrace

      - name: Google Play AAB Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Test APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: test-kurulum-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
