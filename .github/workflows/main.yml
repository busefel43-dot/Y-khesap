name: Build Android AAB and APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Generate AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: ZIP Dosyasini Ac
        run: |
          for f in *zip* *ZIP*; do
            if [ -f "$f" ]; then
              echo "Dosya aciliyor: $f"
              unzip -o "$f" || true
            fi
          done
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r "$SUBDIR"/* . || true
            fi
          fi
          ls -la

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java Kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Paketleri Yukle ve Derle
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: AndroidManifest AdMob Ekle
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/a \ \ \ \ \ \ \ \ <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3759490841134440~UYGULAMA_ID_BURAYA" />' "$MANIFEST" || true
          fi

      - name: AAB ve APK Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Google Play AAB Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Test APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: test-kurulum-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
